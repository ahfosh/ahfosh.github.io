<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伦敦 · 北京 · 悉尼</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}main{min-height:100svh;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8vh 0}section{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}section+section{border-left:1px solid #333}h2{margin:0;color:#aaa;font-size:clamp(14px,2vw,22px);font-weight:400;letter-spacing:.12em}time{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:clamp(18px,6vw,96px);font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}</style><main aria-label="世界时钟"><section><h2>伦敦</h2><time>--:--:--</time></section><section><h2>北京</h2><time>--:--:--</time></section><section><h2>悉尼</h2><time>--:--:--</time></section></main><script>const c=[...document.querySelectorAll("time")],f=["Europe/London","Asia/Shanghai","Australia/Sydney"].map(timeZone=>new Intl.DateTimeFormat("en-GB",{timeZone,hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}));function tick(){const d=new Date;c.forEach((e,i)=>{e.textContent=f[i].format(d);e.dateTime=d.toISOString()})}tick();setInterval(tick,1000)</script></html>
