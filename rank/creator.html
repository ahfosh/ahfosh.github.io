<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小测验创建者排行</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      header {
        background-color: #333;
        color: #fff;
        padding: 10px 20px;
        text-align: center;
      }

      .container {
        margin: 20px auto;
        max-width: 800px;
        padding: 0 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      th {
        background-color: #f2f2f2;
        color: #333;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      img {
        width: 30px;
        height: 30px;
        border-radius: 50%;
      }

      /* Remove hyperlink styles */
      a {
        text-decoration: none;
        color: inherit;
      }

      .btn {
        display: inline-block;
        padding: 8px 16px;
        margin: 5px;
        background-color: #333;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .btn:hover {
        background-color: #555;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>小测验创建者排行</h1>
    </header>
    <div class="container">
      <div id="buttons">
        <button class="btn" onclick="fetchData('1day')">本日</button>
        <button class="btn" onclick="fetchData('1week')">本周</button>
        <button class="btn" onclick="fetchData('1month')">本月</button>
        <button class="btn" onclick="fetchData('1year')">本年</button>
        <button class="btn" onclick="fetchData('all')">全部</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>排名</th>
            <th>UID</th>
            <th>头像</th>
            <th>昵称</th>
            <th>测验次数</th>
            <th>创建个数</th>
          </tr>
        </thead>
        <tbody id="userRankTable">
          <!-- Data will be dynamically populated here -->
        </tbody>
      </table>
      <button id="loadMoreBtn" class="btn">加载更多</button>
    </div>

    <script>
      let currentIndex = 0;

      async function fetchData(period) {
        try {
          const response = await fetch(
            `https://xiaoce.fun/api/v0/xiaoce/user/getTopCreators?period=${encodeURIComponent(period)}`,
          );
          const data = await response.json();
          populateTable(data.data, 0);
        } catch (error) {
          console.error("Error fetching data:", error);
        }
      }

      async function fetchUserStats(userId) {
        try {
          const response = await fetch(
            `https://xiaoce.fun/api/v0/scratch/user/stats?userId=${encodeURIComponent(userId)}`,
          );
          const data = await response.json();
          return data.data;
        } catch (error) {
          console.error("Error fetching user stats:", error);
          return { createScratchTaken: 0, createScratchTotal: 0 };
        }
      }

      async function populateTable(topCreators, startIndex) {
        const tableBody = document.getElementById("userRankTable");
        if (!topCreators) return;

        if (startIndex === 0) {
          tableBody.replaceChildren();
        }

        for (
          let i = startIndex;
          i < topCreators.length && i < startIndex + 10;
          i++
        ) {
          const entry = topCreators[i];
          const user = entry.user || {};
          const userId = user.userId ?? "";
          const userName = user.userName ?? "";
          const icon = user.icon ? String(user.icon).replace(/^\/+/, "") : "";

          const userData = await fetchUserStats(userId);

          const row = document.createElement("tr");
          const cells = Array.from({ length: 6 }, () =>
            row.appendChild(document.createElement("td")),
          );

          cells[0].textContent = String(i + 1);
          cells[1].textContent = String(userId);

          const avatar = document.createElement("img");
          avatar.src = `https://i.chao-fan.com/${encodeURI(icon)}`;
          avatar.alt = "Avatar";
          avatar.referrerPolicy = "no-referrer";
          cells[2].appendChild(avatar);

          const link = document.createElement("a");
          link.href = `https://xiaoce.fun/u/${encodeURIComponent(userId)}`;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = userName;
          cells[3].appendChild(link);

          cells[4].textContent = String(userData.createScratchTaken ?? 0);
          cells[5].textContent = String(userData.createScratchTotal ?? 0);

          tableBody.appendChild(row);
        }

        currentIndex = startIndex + 10;
      }

      document
        .getElementById("loadMoreBtn")
        .addEventListener("click", async function () {
          const response = await fetch(
            `https://xiaoce.fun/api/v0/xiaoce/user/getTopCreators?period=all&start=${encodeURIComponent(currentIndex)}`,
          );
          const data = await response.json();
          populateTable(data.data, currentIndex);
        });

      fetchData("all");
    </script>
  </body>
</html>
