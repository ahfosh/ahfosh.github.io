<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>动态词汇学习器</title>
    <link rel="stylesheet" href="vocab_learner.css">
</head>

<body class="notranslate">
    <!-- Upload Screen -->
    <div id="upload-screen" class="upload-screen">
        <div class="upload-shell">
            <div class="upload-header">
                <div class="upload-logo">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 1.5L18.5 9H13V3.5zM6 4h5v7h7v11H6V4z" />
                    </svg>
                </div>
                <h1 class="upload-title">动态词汇学习器</h1>
            </div>

            <div class="upload-card">
                <div class="upload-card-header">
                    <h2 class="upload-card-title">上传文件</h2>
                </div>

                <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="拖放或选择 Markdown 文件">
                    <div class="drop-zone-icon-wrap">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM12 11l-3 3h2v4h2v-4h2l-3-3z" />
                        </svg>
                    </div>
                    <p class="drop-zone-title">拖放 .md 文件到此处</p>
                    <p class="drop-zone-hint">或点击下方按钮</p>
                </div>

                <div class="upload-actions">
                    <label for="file-input" class="btn btn-primary btn-block">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8h-6V4h-6zm-2 2h2v4h6V6h2v14H4V6zm8 10H8v-2h8v2z" />
                        </svg>
                        <span>选择文件</span>
                    </label>
                    <input type="file" id="file-input" class="file-input-hidden" accept=".md,.markdown,text/markdown">
                </div>

                <div class="upload-footer">支持标准 Markdown 语法 • 本地缓存</div>
            </div>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="hidden">
        <div class="page-header">
            <div class="page-header-inner">
                <div class="page-header-bar">
                    <div class="page-brand">
                        <div class="brand-icon">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 1.5L18.5 9H13V3.5zM6 4h5v7h7v11H6V4z" />
                            </svg>
                        </div>
                        <div>
                            <div class="brand-title">动态词汇学习器</div>
                            <div id="file-name-display" class="file-name-display"></div>
                        </div>
                    </div>

                    <div class="page-toolbar">
                        <div id="stats" class="stats-badge hidden"></div>

                        <button id="export-btn" type="button" class="btn btn-success">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 3l4 4h-3v8h-2V7H8l4-4zm-8 14h16v2H4v-2z" />
                            </svg>
                            <span class="btn-label-full">导出文件</span>
                            <span class="btn-label-short">导出</span>
                        </button>

                        <button id="clear-btn" type="button" class="btn btn-outline btn-outline-danger">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M9 3h6l1 2h4v2H4V5h4l1-2zm1 6h2v9h-2V9zm4 0h2v9h-2V9zM7 9h2v9H7V9z" />
                            </svg>
                            <span class="btn-label-full">清除释义</span>
                        </button>

                        <button id="back-btn" type="button" class="btn btn-outline">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M10.5 5.5L4 12l6.5 6.5 1.4-1.4L7.8 13H20v-2H7.8l4.1-4.1-1.4-1.4z" />
                            </svg>
                            <span class="btn-label-full">返回上传</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="info-bar">
                <div class="info-bar-meta">
                    <span class="mode-badge">词汇检查模式</span>
                    <span id="word-count-badge" class="word-count-badge"></span>
                </div>
                <div class="info-bar-note">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                    </svg>
                    <span>输入框内容实时保存</span>
                </div>
            </div>

            <div class="story-container">
                <div id="rendered-content" class="rendered-content notranslate"></div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <div id="export-modal" class="verify-modal hidden" role="dialog" aria-modal="true" aria-labelledby="export-title">
        <div class="verify-modal-backdrop" data-export-dismiss></div>
        <div class="verify-modal-panel">
            <h2 id="export-title" class="verify-title">导出文件</h2>
            <p id="export-message" class="verify-message"></p>
            <div class="export-progress">
                <div id="export-progress-bar" class="export-progress-bar"></div>
            </div>
            <p id="export-progress-text" class="export-progress-text"></p>
            <div class="verify-actions">
                <button type="button" class="btn btn-outline" data-export-dismiss>取消</button>
                <button type="button" id="export-confirm-btn" class="btn btn-success">导出</button>
            </div>
        </div>
    </div>

    <div id="verify-modal" class="verify-modal hidden" role="dialog" aria-modal="true" aria-labelledby="verify-title">
        <div class="verify-modal-backdrop" data-verify-dismiss></div>
        <div class="verify-modal-panel">
            <h2 id="verify-title" class="verify-title"></h2>
            <p id="verify-message" class="verify-message"></p>
            <div class="verify-actions">
                <button type="button" class="btn btn-outline" data-verify-dismiss>取消</button>
                <button type="button" id="verify-confirm-btn" class="btn btn-danger">确认</button>
            </div>
        </div>
    </div>

    <script src="vocab_learner.js"></script>
</body>

</html>
