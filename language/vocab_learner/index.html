<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态词汇学习器</title>
    <link rel="stylesheet" href="vocab_learner.css">
</head>

<body>
    <!-- Upload Screen -->
    <div id="upload-screen" class="upload-screen">
        <div class="upload-shell">
            <div class="upload-header">
                <div class="upload-logo">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 1.5L18.5 9H13V3.5zM6 4h5v7h7v11H6V4z" />
                    </svg>
                </div>
                <h1 class="upload-title">动态词汇学习器</h1>
            </div>

            <div class="upload-card">
                <div class="upload-card-header">
                    <h2 class="upload-card-title">上传文件</h2>
                </div>

                <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="拖放或选择 Markdown 文件">
                    <div class="drop-zone-icon-wrap">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM12 11l-3 3h2v4h2v-4h2l-3-3z" />
                        </svg>
                    </div>
                    <p class="drop-zone-title">拖放 .md 文件到此处</p>
                    <p class="drop-zone-hint">或点击下方按钮</p>
                </div>

                <div class="upload-actions">
                    <label for="file-input" class="btn btn-primary btn-block">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8h-6V4h-6zm-2 2h2v4h6V6h2v14H4V6zm8 10H8v-2h8v2z" />
                        </svg>
                        <span>选择文件</span>
                    </label>
                    <input type="file" id="file-input" class="file-input-hidden" accept=".md,.markdown,text/markdown">
                </div>

                <div class="upload-footer">支持标准 Markdown 语法 • 本地缓存</div>
            </div>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="hidden">
        <div class="page-header">
            <div class="page-header-inner">
                <div class="page-header-bar">
                    <div class="page-brand">
                        <div class="brand-icon">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm7 1.5L18.5 9H13V3.5zM6 4h5v7h7v11H6V4z" />
                            </svg>
                        </div>
                        <div>
                            <div class="brand-title">动态词汇学习器</div>
                            <div id="file-name-display" class="file-name-display"></div>
                        </div>
                    </div>

                    <div class="page-toolbar">
                        <button id="exam-mode-btn" type="button" class="btn btn-outline btn-exam-mode" aria-pressed="false" title="开启后强制全屏，并禁止复制、翻译、切屏、截图和悬浮窗">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                            </svg>
                            <span class="btn-label-full">考试模式</span>
                            <span class="btn-label-short">考试</span>
                        </button>

                        <div id="exam-timer-badge" class="exam-timer-badge hidden"></div>

                        <div id="stats" class="stats-badge hidden"></div>

                        <button id="export-btn" type="button" class="btn btn-success">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 3l4 4h-3v8h-2V7H8l4-4zm-8 14h16v2H4v-2z" />
                            </svg>
                            <span class="btn-label-full">导出文件</span>
                            <span class="btn-label-short">导出</span>
                        </button>

                        <button id="clear-btn" type="button" class="btn btn-outline btn-outline-danger">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M9 3h6l1 2h4v2H4V5h4l1-2zm1 6h2v9h-2V9zm4 0h2v9h-2V9zM7 9h2v9H7V9z" />
                            </svg>
                            <span class="btn-label-full">清除释义</span>
                        </button>

                        <button id="back-btn" type="button" class="btn btn-outline">
                            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M10.5 5.5L4 12l6.5 6.5 1.4-1.4L7.8 13H20v-2H7.8l4.1-4.1-1.4-1.4z" />
                            </svg>
                            <span class="btn-label-full">返回上传</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="info-bar">
                <div class="info-bar-meta">
                    <span class="mode-badge">词汇检查模式</span>
                    <span id="word-count-badge" class="word-count-badge"></span>
                </div>
                <div class="info-bar-note">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                    </svg>
                    <span>输入框内容实时保存</span>
                </div>
            </div>

            <div class="story-container">
                <div id="rendered-content" class="rendered-content"></div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <div id="export-modal" class="verify-modal hidden" role="dialog" aria-modal="true" aria-labelledby="export-title">
        <div class="verify-modal-backdrop" data-export-dismiss></div>
        <div class="verify-modal-panel">
            <h2 id="export-title" class="verify-title">导出文件</h2>
            <p id="export-message" class="verify-message"></p>
            <div class="export-progress">
                <div id="export-progress-bar" class="export-progress-bar"></div>
            </div>
            <p id="export-progress-text" class="export-progress-text"></p>
            <div class="verify-actions">
                <button type="button" class="btn btn-outline" data-export-dismiss>取消</button>
                <button type="button" id="export-confirm-btn" class="btn btn-success">导出</button>
            </div>
        </div>
    </div>

    <div id="exam-setup-modal" class="verify-modal hidden" role="dialog" aria-modal="true" aria-labelledby="exam-setup-title">
        <div class="verify-modal-backdrop" data-exam-setup-dismiss></div>
        <div class="verify-modal-panel">
            <h2 id="exam-setup-title" class="verify-title">开启考试模式</h2>
            <p class="verify-message">开启后将强制全屏，并禁止复制、翻译、切屏、截图和悬浮窗。可选择考试时长，时间结束后自动锁定。</p>
            <label class="exam-timer-toggle">
                <input type="checkbox" id="exam-timer-enabled">
                <span>设置考试时长</span>
            </label>
            <div id="exam-timer-fields" class="exam-timer-fields hidden">
                <div class="exam-timer-row">
                    <input type="number" id="exam-timer-hours" class="exam-timer-input" min="0" max="24" value="0" inputmode="numeric">
                    <span class="exam-timer-unit">时</span>
                    <input type="number" id="exam-timer-minutes" class="exam-timer-input" min="0" max="59" value="30" inputmode="numeric">
                    <span class="exam-timer-unit">分</span>
                </div>
            </div>
            <p id="exam-setup-error" class="exam-password-error hidden">请设置大于 0 的考试时长</p>
            <div class="verify-actions">
                <button type="button" class="btn btn-outline" data-exam-setup-dismiss>取消</button>
                <button type="button" id="exam-setup-confirm-btn" class="btn btn-exam-mode">开启</button>
            </div>
        </div>
    </div>

    <div id="exam-password-modal" class="verify-modal hidden" role="dialog" aria-modal="true" aria-labelledby="exam-password-title">
        <div class="verify-modal-backdrop" data-exam-password-dismiss></div>
        <div class="verify-modal-panel">
            <h2 id="exam-password-title" class="verify-title">关闭考试模式</h2>
            <p class="verify-message">请输入密码以关闭考试模式</p>
            <input type="password" id="exam-password-input" class="exam-password-input" placeholder="密码" autocomplete="off" spellcheck="false">
            <p id="exam-password-error" class="exam-password-error hidden">密码错误，请重试</p>
            <div class="verify-actions">
                <button type="button" class="btn btn-outline" data-exam-password-dismiss>取消</button>
                <button type="button" id="exam-password-confirm-btn" class="btn btn-danger">确认</button>
            </div>
        </div>
    </div>

    <div id="exam-shield" class="exam-shield hidden" aria-hidden="true">
        <div class="exam-shield-panel">
            <svg class="exam-shield-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
            </svg>
            <h2 class="exam-shield-title">考试保护已启用</h2>
            <p id="exam-shield-message" class="exam-shield-message"></p>
            <button type="button" id="exam-shield-restore-btn" class="btn btn-exam-mode">恢复考试</button>
        </div>
    </div>

    <div id="verify-modal" class="verify-modal hidden" role="dialog" aria-modal="true" aria-labelledby="verify-title">
        <div class="verify-modal-backdrop" data-verify-dismiss></div>
        <div class="verify-modal-panel">
            <h2 id="verify-title" class="verify-title"></h2>
            <p id="verify-message" class="verify-message"></p>
            <div class="verify-actions">
                <button type="button" class="btn btn-outline" data-verify-dismiss>取消</button>
                <button type="button" id="verify-confirm-btn" class="btn btn-danger">确认</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
