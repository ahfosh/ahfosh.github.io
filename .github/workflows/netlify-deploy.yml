# Direct Netlify Deploy API — no git-connected build, only changed files uploaded.
# Public repo safe: token lives only in GitHub Actions secrets (never in git).
# Fork PRs do not receive secrets; job also pinned to this repository.
name: Deploy to Netlify (API)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: "Draft deploy (do not publish)"
        type: boolean
        default: false
      message:
        description: "Deploy message"
        type: string
        default: ""

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

# Least privilege for a public static site
permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'ahfosh/ahfosh.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Netlify secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Missing repository secret NETLIFY_AUTH_TOKEN (Actions → Secrets). Token is never committed to this public repo."
            exit 1
          fi

      - name: Deploy via file digest API
        env:
          # Secret — only available to workflows on this repo (not forks)
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Site id is not sensitive; hardcode so public forks need not set it
          NETLIFY_SITE_ID: 436960d0-e806-404d-86db-9a07a1a682ed
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            ARGS+=(--draft)
          fi
          MSG="${{ inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="${{ github.event.head_commit.message }}"
          fi
          if [ -n "$MSG" ]; then
            ARGS+=(--message "$MSG")
          fi
          node scripts/netlify-deploy.mjs "${ARGS[@]}"
