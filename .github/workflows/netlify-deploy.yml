# Direct Netlify Deploy API — no git-connected build, only changed files uploaded.
name: Deploy to Netlify (API)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: "Draft deploy (do not publish)"
        type: boolean
        default: false
      message:
        description: "Deploy message"
        type: string
        default: ""

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy via file digest API
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            ARGS+=(--draft)
          fi
          MSG="${{ inputs.message }}"
          if [ -z "$MSG" ]; then
            MSG="${{ github.event.head_commit.message }}"
          fi
          if [ -n "$MSG" ]; then
            ARGS+=(--message "$MSG")
          fi
          node scripts/netlify-deploy.mjs "${ARGS[@]}"
