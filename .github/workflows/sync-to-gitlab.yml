# Mirror main → GitLab. Token never placed in remote URL (avoids log/process leaks).
name: Sync to GitLab

on:
  push:
    branches:
      - main

concurrency:
  group: sync-to-gitlab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'ahfosh/ahfosh.github.io'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GitLab token
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::Missing repository secret GITLAB_TOKEN"
            exit 1
          fi

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "https://gitlab.com/ahfosh/ahfosh.gitlab.io.git"
          # Auth via HTTP header only — do not embed token in the remote URL
          AUTH_B64="$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          git config --local "http.https://gitlab.com/.extraheader" "Authorization: Basic ${AUTH_B64}"
          git push -f gitlab HEAD:main
          # Optional: mirror tags on main tip only (safer than --all force)
          git push -f gitlab --tags || true
          git config --local --unset-all "http.https://gitlab.com/.extraheader" || true
